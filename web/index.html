<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SAM 클릭→마스크 데모</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 20px; background: #111; color: #eee; }
  #hud { margin: 10px 0; font-size: 14px; color: #8f8; min-height: 20px; }
  #wrap { position: relative; display: inline-block; }
  canvas { max-width: 100%; cursor: crosshair; border: 1px solid #444; }
  #mask { position: absolute; left: 0; top: 0; pointer-events: none; }
  button { margin-right: 8px; padding: 6px 14px; }
</style>
</head>
<body>
<h3>SAM 클릭→마스크 (서버 인코더 1회 + 브라우저 ONNX 디코더)</h3>
<input type="file" id="file" accept="image/*">
<button id="commit">객체 확정 (Enter)</button>
<button id="clear">전체 지우기</button>
<span id="samples"></span>
<div style="margin-top:8px">
  <input id="classes" placeholder="클래스 (쉼표 구분): cat, remote, couch" size="42">
  <button id="auto"><b>오토라벨 실행</b></button>
  <span style="color:#888;font-size:13px">← 자동이 다 깔고, 클릭은 보정용</span>
</div>
<div id="hud">이미지를 선택하세요. 클릭=객체 하나씩 자동 확정 · Shift+클릭=현재 객체 정제 · 우클릭=제외 포인트</div>
<div id="wrap">
  <canvas id="img"></canvas>
  <canvas id="mask"></canvas>
</div>
<script>
const LONG_SIDE = 1024;
let session, embedTensor, origSize, scale, points = [], labels = [], currentKey = null;
let loadSeq = 0;  // 이미지 로드 순번 — 늦게 도착한 임베딩 응답 폐기용
const imgCanvas = document.getElementById("img");
const maskCanvas = document.getElementById("mask");
const hud = document.getElementById("hud");
let bitmap = null;
// 확정된 객체 마스크 누적 레이어 — 객체마다 색 분리
const committedCanvas = document.createElement("canvas");
let lastMask = null, objectCount = 0;
const PALETTE = [[46,204,113],[52,152,219],[231,76,60],[241,196,15],[155,89,182],[26,188,156]];

async function loadModel() {
  session = await ort.InferenceSession.create("/static/sam_decoder.onnx", { executionProviders: ["wasm"] });
  hud.textContent = "디코더 로드 완료. 이미지를 선택하세요.";
}
loadModel();

async function loadSamples() {
  const names = await (await fetch("/api/samples")).json();
  const box = document.getElementById("samples");
  names.forEach((n, i) => {
    const b = document.createElement("button");
    b.textContent = `샘플${i + 1}`;
    b.onclick = async () => {
      const blob = await (await fetch(`/samples/${n}`)).blob();
      await loadImage(new File([blob], n, { type: "image/jpeg" }));
    };
    box.appendChild(b);
  });
}
loadSamples();

document.getElementById("file").addEventListener("change", async (e) => {
  if (e.target.files[0]) await loadImage(e.target.files[0]);
});

async function loadImage(f) {
  // 임베딩 도착 전 클릭이 이전 이미지 임베딩을 쓰는 레이스 차단
  embedTensor = null; currentKey = null;
  const seq = ++loadSeq;
  bitmap = await createImageBitmap(f);
  imgCanvas.width = maskCanvas.width = committedCanvas.width = bitmap.width;
  imgCanvas.height = maskCanvas.height = committedCanvas.height = bitmap.height;
  imgCanvas.getContext("2d").drawImage(bitmap, 0, 0);
  committedCanvas.getContext("2d").clearRect(0, 0, committedCanvas.width, committedCanvas.height);
  points = []; labels = []; lastMask = null; objectCount = 0;
  hud.textContent = "임베딩 계산 중 (서버, 이미지당 1회)…";

  const fd = new FormData();
  fd.append("file", f);
  const t0 = performance.now();
  const res = await fetch("/api/embed", { method: "POST", body: fd });
  const j = await res.json();
  if (seq !== loadSeq) return;  // 그 사이 다른 이미지가 로드됨 — 이 응답 폐기
  if (j.orig_size[0] !== bitmap.height || j.orig_size[1] !== bitmap.width) {
    hud.textContent = `크기 불일치: 서버 ${j.orig_size} vs 캔버스 ${bitmap.height}x${bitmap.width}`;
    return;
  }
  const bytes = Uint8Array.from(atob(j.embedding), c => c.charCodeAt(0));
  embedTensor = new ort.Tensor("float32", new Float32Array(bytes.buffer), j.shape);
  origSize = j.orig_size;
  currentKey = j.key;
  scale = LONG_SIDE / Math.max(...origSize);
  hud.textContent = `임베딩 완료: 서버 인코딩 ${j.encode_ms}ms (왕복 ${Math.round(performance.now() - t0)}ms)` +
    (j.cached ? " [캐시]" : "") + " — 클릭하세요";
}

async function runDecoder() {
  const n = points.length;
  const coords = new Float32Array((n + 1) * 2);
  const labs = new Float32Array(n + 1);
  points.forEach((p, i) => { coords[i * 2] = p[0] * scale; coords[i * 2 + 1] = p[1] * scale; labs[i] = labels[i]; });
  coords[n * 2] = 0; coords[n * 2 + 1] = 0; labs[n] = -1;  // 패딩 포인트

  const t0 = performance.now();
  const out = await session.run({
    image_embeddings: embedTensor,
    point_coords: new ort.Tensor("float32", coords, [1, n + 1, 2]),
    point_labels: new ort.Tensor("float32", labs, [1, n + 1]),
    mask_input: new ort.Tensor("float32", new Float32Array(256 * 256), [1, 1, 256, 256]),
    has_mask_input: new ort.Tensor("float32", [0], [1]),
    orig_im_size: new ort.Tensor("float32", [origSize[0], origSize[1]], [2]),
  });
  const ms = Math.round(performance.now() - t0);
  console.log("[decoder]", JSON.stringify({
    point: points[points.length - 1], scale, origSize,
    canvas: [imgCanvas.height, imgCanvas.width], iou: out.iou_predictions.data[0],
  }));

  // ONNX 그래프의 원본 크기 후처리는 세로 이미지에서 crop 치수가 뒤집히는 버그가 있어
  // 종횡비 무관한 low_res_masks(256x256, 패딩된 1024 프레임)를 받아 JS에서 직접 복원한다
  lastMask = lowResToMask(out.low_res_masks.data);
  render();
  hud.textContent = `디코더 ${ms}ms (브라우저, IoU ${out.iou_predictions.data[0].toFixed(2)}) — ` +
    `확정 ${objectCount}개. 다른 곳 클릭=다음 객체 · Shift+클릭=이 객체 정제 · 우클릭=제외`;
}

function lowResToMask(low) {
  // low: 256x256 로짓, 1024x1024 패딩 프레임 기준. 유효 영역만 잘라 원본 크기로 확대.
  const [H, W] = [origSize[0], origSize[1]];
  const s = document.createElement("canvas");
  s.width = s.height = 256;
  const sctx = s.getContext("2d");
  const id = sctx.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) {
    // 로짓을 알파(0~255)로 인코딩: 0 로짓 = 128, 업샘플 보간 후 128 임계로 복원
    id.data[i * 4 + 3] = Math.max(0, Math.min(255, low[i] * 32 + 128));
    id.data[i * 4] = 255;
  }
  sctx.putImageData(id, 0, 0);
  const validW = Math.round(256 * (W * scale) / 1024);
  const validH = Math.round(256 * (H * scale) / 1024);
  const d = document.createElement("canvas");
  d.width = W; d.height = H;
  const dctx = d.getContext("2d");
  dctx.imageSmoothingEnabled = true;
  dctx.imageSmoothingQuality = "high";
  dctx.drawImage(s, 0, 0, validW, validH, 0, 0, W, H);
  const px = dctx.getImageData(0, 0, W, H).data;
  const m = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) m[i] = px[i * 4 + 3] >= 128 ? 1 : 0;
  return m;
}

function maskToCanvas(mask, color, alpha) {
  const [H, W] = [origSize[0], origSize[1]];
  const tmp = document.createElement("canvas");
  tmp.width = W; tmp.height = H;
  const tctx = tmp.getContext("2d");
  const imgData = tctx.createImageData(W, H);
  for (let i = 0; i < H * W; i++) {
    if (mask[i] > 0) {
      imgData.data[i * 4] = color[0]; imgData.data[i * 4 + 1] = color[1];
      imgData.data[i * 4 + 2] = color[2]; imgData.data[i * 4 + 3] = alpha;
    }
  }
  tctx.putImageData(imgData, 0, 0);
  return tmp;
}

function render() {
  const ctx = maskCanvas.getContext("2d");
  ctx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
  ctx.drawImage(committedCanvas, 0, 0);
  if (lastMask) {
    const color = PALETTE[objectCount % PALETTE.length];
    ctx.drawImage(maskToCanvas(lastMask, color, 150), 0, 0);
  }
  drawPoints(ctx);
}

function commitObject() {
  if (!lastMask) return;
  const color = PALETTE[objectCount % PALETTE.length];
  committedCanvas.getContext("2d").drawImage(maskToCanvas(lastMask, color, 150), 0, 0);
  objectCount++;
  points = []; labels = []; lastMask = null;
  render();
  hud.textContent = `객체 ${objectCount}개 확정 — 다음 객체를 클릭하세요`;
}

document.getElementById("commit").addEventListener("click", commitObject);
window.addEventListener("keydown", (e) => { if (e.key === "Enter") commitObject(); });

document.getElementById("auto").addEventListener("click", async () => {
  if (!currentKey) { hud.textContent = "먼저 이미지를 로드하세요"; return; }
  const classes = document.getElementById("classes").value.split(",").map(s => s.trim()).filter(Boolean);
  if (!classes.length) { hud.textContent = "클래스를 입력하세요 (예: cat, remote)"; return; }
  hud.textContent = "오토라벨 실행 중 (첫 실행은 DINO 로드 포함)…";
  const res = await fetch("/api/autolabel", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key: currentKey, classes, threshold: 0.35 }),
  });
  const j = await res.json();
  if (j.error) { hud.textContent = j.error; return; }
  const ctx = committedCanvas.getContext("2d");
  if (j.overlay) {
    const img = new Image();
    img.src = "data:image/png;base64," + j.overlay;
    await img.decode();
    ctx.drawImage(img, 0, 0);
  }
  ctx.font = "16px sans-serif"; ctx.lineWidth = 2;
  j.detections.forEach((d, i) => {
    const [x1, y1, x2, y2] = d.box;
    ctx.strokeStyle = "#fff";
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    ctx.fillStyle = "#fff";
    ctx.fillText(`${d.label} ${d.score}`, x1 + 3, Math.max(y1 - 5, 14));
  });
  objectCount += j.detections.length;
  render();
  hud.textContent = `오토라벨 완료: ${j.detections.length}개 객체 ` +
    `(검출 ${j.det_ms}ms + 분할 ${j.seg_ms}ms) — 틀린 곳만 클릭으로 보정`;
});

function drawPoints(ctx) {
  points.forEach((p, i) => {
    ctx.beginPath();
    ctx.arc(p[0], p[1], 6, 0, Math.PI * 2);
    ctx.fillStyle = labels[i] === 1 ? "#2ecc71" : "#e74c3c";
    ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  });
}

function canvasPos(e) {
  const r = imgCanvas.getBoundingClientRect();
  return [(e.clientX - r.left) * (imgCanvas.width / r.width),
          (e.clientY - r.top) * (imgCanvas.height / r.height)];
}

imgCanvas.addEventListener("click", (e) => {
  if (!embedTensor) return;
  // 기본: 클릭 = 새 객체 (이전 객체는 자동 확정). Shift+클릭 = 현재 객체에 포인트 추가(정제)
  if (!e.shiftKey && points.length > 0) commitObject();
  points.push(canvasPos(e)); labels.push(1);
  runDecoder();
});
imgCanvas.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  if (!embedTensor || points.length === 0) return;  // 제외 포인트는 정제 전용
  points.push(canvasPos(e)); labels.push(0);
  runDecoder();
});
document.getElementById("clear").addEventListener("click", () => {
  points = []; labels = []; lastMask = null; objectCount = 0;
  committedCanvas.getContext("2d").clearRect(0, 0, committedCanvas.width, committedCanvas.height);
  maskCanvas.getContext("2d").clearRect(0, 0, maskCanvas.width, maskCanvas.height);
  hud.textContent = "초기화됨 — 클릭하세요";
});
</script>
</body>
</html>
